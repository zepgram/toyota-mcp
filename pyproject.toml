[project]
name = "toyota-mcp"
version = "0.1.0"
description = "Read-only MCP server for MyToyota Europe — ask your Toyota anything"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Benjamin Calef", email = "admin@username.digital" }
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.1,<3",
    "pytoyoda>=5.2.0,<6",
    "pydantic-settings>=2.7,<3",
]
keywords = ["mcp", "model-context-protocol", "toyota", "mytoyota", "connected-services"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/zepgram/toyota-mcp"
Issues = "https://github.com/zepgram/toyota-mcp/issues"

[project.scripts]
toyota-mcp = "toyota_mcp.server:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4",
    "mypy>=2.3",
    "ruff>=0.16",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = [
    "live: exercises the real Toyota API with real credentials; deselected by default",
]
filterwarnings = [
    "ignore:The `update_forward_refs` method is deprecated:DeprecationWarning",
]
